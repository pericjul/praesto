spring:
  application:
    name: praesto
  ai:
    # Azure OpenAI: KI-Funktionen laufen in der EU (Region "Sweden Central") – so ist es
    # in der Datenschutzerklärung ausgewiesen. Region/Modell kommen aus AZURE_OPENAI_ENDPOINT/
    # -DEPLOYMENT und MÜSSEN zur Datenschutzerklärung passen. Genutztes Modell: gpt-5-mini.
    # Defaults erlauben App-Start ohne echte Werte (KI-Aufrufe fallen dann auf Fallbacks zurück).
    azure:
      openai:
        api-key: ${AZURE_OPENAI_KEY:dummy-key}
        endpoint: ${AZURE_OPENAI_ENDPOINT:https://example.openai.azure.com/}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_DEPLOYMENT:gpt-5-mini}
            # temperature MUSS gesetzt sein, weil Spring AI sonst seinen Default (0.7)
            # sendet – GPT-5-/Reasoning-Modelle lehnen alles ausser 1 mit 400 ab.
            # Per AZURE_OPENAI_TEMPERATURE überschreibbar (nur für Modelle wie gpt-4o,
            # die abweichende Werte erlauben).
            temperature: ${AZURE_OPENAI_TEMPERATURE:1.0}
        embedding:
          options:
            # Eigenes Embedding-Deployment in Azure OpenAI (für die KI-Wissensbasis /
            # Vektorsuche). MUSS in Azure als Deployment angelegt sein. Standard: das
            # günstige text-embedding-3-small (1536 Dimensionen).
            deployment-name: ${AZURE_OPENAI_EMBED_DEPLOYMENT:text-embedding-3-small}

  datasource:
    # Default = lokale PostgreSQL. In Prod via DB_URL/DB_USERNAME/DB_PASSWORD überschrieben
    # (z.B. Azure Database for PostgreSQL, Switzerland North).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/praesto}
    username: ${DB_USERNAME:praesto}
    password: ${DB_PASSWORD:praesto}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # E-Mail (optional): nur aktiv wenn MAIL_HOST gesetzt ist. Sonst werden
  # Kontaktanfragen nur in der DB gespeichert (Super-Admin → "Anfragen").
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

praesto:
  # KI-Wissensbasis (RAG): Quellen werden in Häppchen zerlegt, als Vektoren (Embeddings)
  # in PostgreSQL (pgvector) gespeichert und pro Schülerfrage werden nur die relevantesten
  # Häppchen an die KI geschickt. Voraussetzung in Prod: Extension "vector" aktiviert +
  # Embedding-Deployment vorhanden. Ohne das fällt die KI automatisch auf die einfache
  # Variante zurück (alle aktiven Quellen als Text, gedeckelt).
  knowledge:
    embeddings-enabled: ${KNOWLEDGE_EMBEDDINGS:true}
    embedding-dim: ${KNOWLEDGE_EMBEDDING_DIM:1536}   # muss zum Embedding-Modell passen
    chunk-size: 900
    chunk-overlap: 150
    top-k: ${KNOWLEDGE_TOP_K:5}
  # Datei-Ablage: "local" (Dateisystem, Standard) oder "azure" (Azure Blob Storage).
  # Umschalten via STORAGE_TYPE=azure + AZURE_STORAGE_CONNECTION_STRING in den App-Einstellungen.
  storage:
    type: ${STORAGE_TYPE:local}
    # Einmal-Migration lokaler Dateien -> Blob beim Start (danach wieder entfernen).
    migrate-local-to-blob: ${MIGRATE_LOCAL_TO_BLOB:false}
    azure:
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
      container: ${AZURE_STORAGE_CONTAINER:documents}
  uploads:
    dir: ${PRAESTO_UPLOADS_DIR:uploads}
  jwt:
    secret: ${JWT_SECRET}          # min 256-bit (32 Bytes), in Azure App Settings
    expiration-hours: 24
  super-admin:
    email: ${SUPER_ADMIN_EMAIL}
    password: ${SUPER_ADMIN_PASSWORD}
  demo:
    school-name: "Demo Schule Praesto"
  contact:
    recipient: ${CONTACT_RECIPIENT_EMAIL:}
    from: ${MAIL_FROM:}
